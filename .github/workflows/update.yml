name: Update metal prices

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prices
        env:
          METALCHARTS_KEY: ${{ secrets.METALCHARTS_KEY }}
        run: python update_prices.py
      - name: Save the figures
        if: always()
        run: |
          git config user.name "rgm-metal-prices"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json || true
          git diff --cached --quiet || git commit -m "Update prices"
          git push
